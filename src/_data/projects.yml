# Current research and writing projects, shown on the Research page (/research/).
#
# Nothing here is a publication claim. Each project carries one status from this list:
#   Published · Forthcoming · Under Review · In Revision · Working Paper ·
#   Book Project · Research in Progress · Essay in Development · Archive
#
#   id        anchor on the Research page (/research/#id)
#   title     working title          status   one value from the list above
#   summary   one or two sentences   programs bodies of work it belongs to (programs.yml)
#   works     ids of published records that belong to it (checked by the validator)
#   show      false hides the project from the site without deleting it
#   review    draft until Wayne approves the title, status and summary
#   basis     where the wording came from (for the editors; never shown)
#
# DRAFTED 2026-10-07. Titles, statuses and summaries come from the previous site and
# from Wayne's own notes on each project. No publisher, contract, journal or date is
# claimed for unfinished work. Every entry is draft until Wayne reviews it.

- id: abandonment-in-real-time
  title: Abandonment in Real Time
  status: Book Project
  summary: A book on how routine institutional practices under scarcity contribute to abandonment and premature death among people experiencing homelessness — without requiring malicious individual actors.
  programs: [homelessness-abandonment, critical-interactionism]
  works:
    - dm-the-epistemology-of-abandonment-a-critical-interactionist-th
    - dm-the-career-of-disposability-street-outreach-fentanyl-and-the
    - dm-maladjustment-as-insight-the-epistemology-of-the-abandoned
    - nz-2026-04-13-how-santa-barbaras-institutions-produce-harm
    - nz-2026-04-27-everyone-was-being-reasonable-and-he-died-anyway
  show: true
  review: draft
  basis: Title from the previous site (Books & Manuscripts in Progress). Summary from Wayne's statement of the book's central problem. The subtitle is withheld because the previous site and Wayne's notes give two different ones.

- id: sociology-of-interaction
  title: The Sociology of Interaction
  status: Book Project
  summary: A book reconstructing the interactionist tradition from Mead through Goffman, Garfinkel and conversation analysis to Critical Interactionism. Its organizing argument is that interactionism asked the questions, ethnomethodology and conversation analysis transformed what counts as an answer, and Critical Interactionism extends what must be followed.
  programs: [interaction-emca, critical-interactionism]
  works:
    - dm-building-a-new-astronomy-without-a-telescope-why-critical-in
    - dm-from-minds-to-moments-how-ethnomethodology-and-conversation
    - dm-george-herbert-mead-and-the-making-of-symbolic-interactionis
  show: true
  review: draft
  basis: Wayne's notes (retitled September 2026). The previous site listed a book manuscript "From Minds to Moments"; whether that is the same project is a question for Wayne.

- id: critical-interactionism
  title: Critical Interactionism
  status: Research in Progress
  summary: The theoretical framework behind most of Wayne’s current work, developed in essays on the moral economy of interaction, the layered moral economy of oppression, and what follows once asymmetries are documented in interaction.
  programs: [critical-interactionism]
  works:
    - dm-the-moral-economy-of-interaction
    - dm-the-layered-moral-economy-of-oppression-completing-the-santa
    - dm-what-do-we-owe-one-another-once-we-see-asymmetries-being-don
    - dm-beyond-asymmetries-in-action-critical-interactionism-moral-e
  show: true
  review: draft
  basis: Previous site (biography; Santa Barbara School bibliography annotations).

- id: doing-essays
  title: "Doing Modernity, Doing Equality, Doing Autonomy"
  status: Essay in Development
  summary: A set of essays on how large social arrangements are accomplished in ordinary interaction — contemporary social order, equality (with formal consensus as the principal case, and a distinction between recognition, voice and traction), and autonomy as a collective, performed practice.
  programs: [critical-interactionism]
  show: true
  review: draft
  basis: Wayne's notes on the three essays (October 2026).

