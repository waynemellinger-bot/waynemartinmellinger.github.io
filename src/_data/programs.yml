# Intellectual programs: the larger bodies of Wayne's thought a work substantively contributes to.
# Order here is the order shown on the site. "path" is the program's page.
# A work joins a program only when the connection is defensible; none is a valid answer.
#
# Slugs, names, paths and order are unchanged from the accepted Noozhawk pilot.
# "description" was added 2026-10-07 and revised the same day per the content review
# (Critical Interactionism, Homelessness, Critical Drug Studies, Religious & Dionysian Naturalism).
# All six are PROVISIONAL until Wayne approves scope and voice. Approving a description does not
# approve any work's assignment to the program.
- slug: critical-interactionism
  name: Critical Interactionism
  path: /scholarship/critical-interactionism/
  description: An approach to studying how power, inequality, recognition and social change are accomplished through interaction and institutional practices, bringing ethnomethodology and conversation analysis into dialogue with institutional ethnography and critical social theory.
- slug: interaction-emca
  name: Sociology of Interaction / EMCA
  path: /scholarship/sociology-of-interaction/
  description: The close empirical study of how people produce social order through everyday interaction — the tradition Wayne trained in at UC Santa Barbara under Don H. Zimmerman, Thomas P. Wilson and Harvey Molotch, and which he documents as the Santa Barbara School.
- slug: homelessness-abandonment
  name: Homelessness, Institutional Abandonment & Social Policy
  path: /scholarship/homelessness-and-abandonment/
  description: Research and public writing on homelessness, housing, institutional care and abandonment, informed by lived experience and work in Santa Barbara’s service and advocacy networks.
- slug: critical-drug-studies
  name: Critical Drug Studies
  path: /scholarship/critical-drug-studies/
  description: Research and writing on drug use, identity, altered states, harm reduction and the institutions and inequalities that shape them.
- slug: religious-dionysian-naturalism
  name: Religious & Dionysian Naturalism
  path: /religion-philosophy/religious-and-dionysian-naturalism/
  description: Research on religious naturalism, contemporary nature religions, embodied ritual and ecological responsibility, including the constructive project of Dionysian Religious Naturalism.
- slug: public-sociology-justice
  name: Public Sociology & Social Justice
  path: /public-writing/public-sociology/
  description: Sociological research, political analysis and street-level experience translated for a general audience.
