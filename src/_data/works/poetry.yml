- id: poem-a-theology-of-wonder
  title: A Theology of Wonder
  date: '2007-12-03'
  meta:
  - 3 December 2007
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/a-theology-of-wonder/
  order: 1
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: '"To be spiritual is to be amazed." — Abraham Joshua Heschel'
  - stanza: |-
      Every now and then, the ordinary trips the switch.
      It may be a black beetle on a red rose bush
      or a dead horseshoe crab washed ashore.
      These mundane things rip open a portal,
      a glimpse of the universe's staggering beauty,
      the majestic dance of creation.
  - stanza: |-
      For a stolen moment, you're yanked
      from the dreary confines of your mind,
      the self-pitying litany silenced.
      A gentle reprieve from the endless loop of doubt.
      A space to ponder the angels' whispers,
      the crab's death a potential omen,
      a harbinger of all crustaceans.
  - stanza: |-
      But who knows? Maybe it's all just random.
      Beetles crawl and dead sea creatures wash ashore.
      No grand design etched on the cosmic canvas,
      just existence unfolding,
      an endless, mesmerizing story.
  - stanza: |-
      Why do these moments slip through our fingers?
      Why do we drift back to autopilot, that sleepwalking routine?
      Surely these jolts of wonder,
      these glimpses of life's miracles, are blessings.
  - stanza: |-
      But blessings fade.
      The chatter of monkey minds begins again.
      This is the cycle, our journey —
      moments of awe punctuated by the mundane.
      Yet, in these startling glimpses,
      there's a spark to hold onto.
      Even the ordinary, if we pay attention, can hold
      the seeds of wonder.
- id: poem-consider-the-lizard
  title: Consider the Lizard
  date: '2007-12-18'
  meta:
  - 18 December 2007
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/consider-the-lizard/
  order: 2
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: |-
      Each day the lizard with his lime green sheen
      waits on sun-baked stones, while the butterflies dance
      and the bumblebees hum in the spring meadow.
      There is a pregnant pause of anticipation
      when he leaps and eats his meal.
      Life feeds on life — a brutal, primal score.
  - stanza: |-
      I cannot fathom the true meaning of this ritual,
      but I know this:
      anyone who hopes to escape death,
      and hold at bay the endless circle of life,
      has not considered the lizard —
      how he basks in his spot,
      rejuvenated by afternoon heat and insect-filled belly.
  - stanza: |-
      He watches the bough of the oak tree bend,
      listening to the crickets chirping incessantly as the sun sets on the field,
      as though all were planned and everything unfolded
      according to nature's unique desire.
      The field grows dark with a lavender light.
      The lizard crawls under a rock.
      The sky grows bright, star after shining star.
- id: poem-spurred-by-friends-saved-by-strangers
  title: Spurred by Friends, Saved by Strangers
  date: '2007-10-16'
  meta:
  - 16 October 2007
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/spurred-by-friends-saved-by-strangers/
  order: 3
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: |-
      Can we bury thoughts by writing words?
      Can I dissolve my feelings of rejection by putting them down on paper
      and seeing their black finality?
      Five years ago I was a popular man
      who was sought after by old friends who came to town.
      But then I screwed up — did meth,
      attempted death,
      fell apart,
      ran wild,
      got arrested, went to jail.
      Now I do recovery, but some things cannot return.
      Some cannot forgive or forget my crimes.
      It hurts that so many have written me off forever and no longer seek my counsel.
      I have been spurred by friends and saved by strangers.
- id: poem-the-search-for-light
  title: The Search for Light
  date: '2007-08-06'
  meta:
  - 6 August 2007 — for Ingmar Bergman
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/the-search-for-light/
  order: 4
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: As I sit in this cold stone pew the dim grey illumination coming from the clouds casts few shadows on this winter morning — just the slight subtleties of shifting light.
  - stanza: My nightmares burst with bright sunlight and lurid naked glares. My entry into psychosis is blinding. I need clouds and trees and curtains veiling the light, softening it and making it move. I need small doses of light slowly dimming my lover's face until finally only a silhouette is left. Some days this lack of light is reinforced by isolation. Decorous conversations hide loneliness, tensions that cannot be expressed. No sound but the whimper of the wind, the chime of the clocktowers. Life decays towards nothing, but we cling on, trying urgently and clumsily to connect. We see ourselves through windows and in mirrors — divided selves gaze on our darker pasts until all masks dissolve. On a rugged limestone island a bleak dream-world is lived, where stuffed toys become talismans. I hope the bleeding will one day cease. Lighter moments sometimes surface in which I play comedies surrounded by laughter and pretty women. But darkness waits on the edge, loitering like a cloaked stranger playing drawn-out games, and flocks of black birds keep me company — rage, regret and anxiety keep me alert to life's demons, and keep me searching for the hidden lights of a lover.
- id: poem-that-which-is-not-meant-to-be-seen
  title: That Which Is Not Meant to Be Seen
  date: '2003'
  meta:
  - '2003'
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/that-which-is-not-meant-to-be-seen/
  order: 5
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: One evening I returned to the Ventura River and walked beneath the Main Street bridge to this bamboo thicket off to the left where the night before I had talked to a young man who seemed very sick. Diarrhea had ruined his pants. He said he ate bad berries. I went to my car to get him some sweatpants and to the bodega for a quart of milk. I told him then he needed to go to the hospital. He said "I'll be alright" — stupid bastard. And now as I approach the spot where he lay to rest I see his corpse lying there. What was weirdest was his nose was gone, as if tree rats had found him before I did and had a midnight snack. I worried that my footprints led to his body. High on crack I knew I couldn't call 911. What matter — it was too late. If you see a man whose nose is chewed off, you have seen that which is not meant to be seen.
- id: poem-turning-fumbles-into-swan-dives
  title: Turning Fumbles Into Swan Dives
  date: '2020-03'
  meta:
  - March 2020
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/turning-fumbles-into-swan-dives/
  order: 6
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: As we face the ugliness of the world — seeing things as they really are and accepting that as what really is — we must stay determined to be ourselves and to speak that which must be spoken. To turn our suffering into something that is beautiful we must focus on the present moment and our sometimes haphazard forward momentum.
  - stanza: When the school of life provides us with growth pains, or we find that we are fumbling, we must gracefully turn that into a swan dive, for to enter the gates of the underworld with a smile on our face is to paradoxically be in paradise. Our suffering can be a call to re-evaluate the path we are on. We must be willing to let go of our dreams so as to live the life that is waiting for us. It is in these darkest moments that light may appear and we become re-born with unknown gifts and hidden strengths.
- id: poem-insane
  title: Insane
  date: '2018-01'
  meta:
  - January 2018
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/insane/
  order: 7
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: |-
      The people who are seen as "normal"
      who play their parts,
      follow the rules,
      and obey the laws,
      are often the ones who are insane.
  - stanza: |-
      The people who do their own thing,
      reject the roles,
      break the rules,
      and disobey the laws,
      are often the ones who are "sane."
  - stanza: |-
      To accept the rules of a crazy world is an act of craziness itself.
      But to rebel against those same rules is a healthy, liberating act.
  - stanza: |-
      So what then is "insanity,"
      and who is truly sane?
      Who decides psychiatric diagnoses, med regimes, and treatment plans?
      Words like "mental illness" are labels applied by powerful people to control
      what they consider wrong or unacceptable. It's merely opinion.
  - stanza: |-
      The truth is, humans vary immensely,
      and cultures differ in their views on what is right and wrong.
      It's true that many suffer and need a helping hand,
      and each of us has had days when we can barely hold on.
      Mental illness can be real.
  - stanza: |-
      There's no way to stay sane in an insane world, except by being yourself —
      the unique individual that you are.
- id: poem-dionysian-thinking
  title: Dionysian Thinking
  date: '2011-01-30'
  meta:
  - 30 January 2011
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/dionysian-thinking/
  order: 8
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: Dionysian thinking is not static or fixed but exists in constant flux. Rather than clear and precise linear pronouncements, it offers delirious and ecstatic "non-sense."
  - stanza: |-
      The abandonment of reason leads it to plunge into realms of unreason,
      evoking Lucretius, Spinoza, Nietzsche, Klossowski, Bataille, Deleuze,
      Foucault, Genet, Burroughs, and Bey, to forge a philosophy of affirmation.
  - stanza: |-
      It does not seek foundational concepts
      but continually works against the grain of traditional categories
      and conventional methods to reclaim State knowledge.
      Anti-imperial clandestine resistance to the holies of fascism
      — Capital, State, Family, Industry — keeps its purposes close at hand.
  - stanza: |-
      Also called "nomad thought" or heterology, it privileges multiplicity
      but never as a foundation. It opposes the solidity
      and sedentariness of Empires and States and the logic that sustains them.
      Rather than trees of learning, it is a rhizomic root-sender,
      always multiplying elements in a fecund way.
  - stanza: |-
      Libidinal politics is the self-organizing flow of intensities
      and an enchanted realm of desire. Because it does not glorify negation,
      its explanations are genealogical or other non-dialectical approaches.
  - stanza: |-
      Dionysian thinking affirms life as a dream arising
      from the detritus of a dilapidated, self-effacing assembly of nodal points,
      on-off switches, and endless circuits of impulses. Excess and overflow abound,
      as does the Sun's expenditure of energy. The ecstatic frenzy of trances, intoxication, shamanic journeying, schizophrenia, and orgasm are sacred acts of liberation.
  - stanza: |-
      In this vein, we shall gather again at river bottoms, strip off all our clothes,
      partake in entheogenic sacraments.
- id: poem-danny-las-vegas-hustler
  title: Danny, Las Vegas Hustler
  date: '2024-02-13'
  meta:
  - 13 February 2024
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/danny-las-vegas-hustler/
  order: 9
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: '"It''s not easy being a male hustler on the Las Vegas Strip. Sure, you make a lot of money, but it goes so quickly and the competition is fierce. You don''t know who you can trust."'
  - stanza: |-
      In one hand,
      a large bunny mask,
      white, fluffy, absurd in this context.
      In the other, an overstuffed athletic bag,
      filled with most of his world —
      a change of clothes,
      a half dozen sex toys,
      three star-shaped candlesticks
      he grabbed from somewhere along the way.
  - stanza: |-
      A backpack rides heavy on his back.
      Danny moves quickly —
      the Strip teaches you this —
      grab all you can,
      and disappear.
  - stanza: |-
      He steps into the shower,
      tries to wash away the years
      he claims are only 26,
      but his body says otherwise.
      The wear and tear
      of hustling, drugs,
      and "friends"
      who keep him in poverty,
      homeless for eight years.
  - stanza: |-
      But there's always an exit.
      Always a rush —
      now it's morning.
      He's stuffing his bags,
      can't find his shoes.
      "Any cash? Drugs? Insurance?"
      The questions tumble out —
      who asks for insurance
      as they're about to leave?
  - stanza: |-
      The door waits,
      and you wonder
      how long he can move
      through the world
      before all of it catches up —
      the hustling, the drugs,
      the endless cycle
      of grab and go.
- id: poem-the-throne-room
  title: The Throne Room
  date: '2024-03-30'
  meta:
  - 30 March 2024
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/the-throne-room/
  order: 10
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: |-
      The bathroom may be
      a fluorescent purgatory,
      but as I sit upon this porcelain throne,
      a sliver of glass catches the light,
      casting fractured rainbows
      on the cold, institutional tile.
  - stanza: |-
      Outside the window,
      a wren taps its beak against the glass —
      a tiny Zen master, unfazed
      by the relentless flow of human traffic.
  - stanza: |-
      Here, upon these cold seats,
      we confront our fragile truths,
      our bodies — magnificent, mundane,
      messy yet necessary.
  - stanza: |-
      This ritual,
      a shedding of layers,
      an invitation simply to be.
  - stanza: |-
      The gurgle, the flush,
      remind us to release,
      to flow with the rhythms of life.
  - stanza: |-
      In this small moment,
      a universe unfolds.
      We exit a little lighter, a little wiser,
      catching ourselves in the mirror,
      seeing, perhaps, our truest self.
  - stanza: |-
      Beneath these fluorescent lights,
      the sacred hum of existence vibrates,
      whispering that even in
      the most mundane rituals,
      the sacred is always waiting to be found.
- id: poem-held-in-the-dark-a-psychedelic-crisis-a-strangers
  title: 'Held in the Dark: A Psychedelic Crisis, a Stranger''s Voice, and the Edges of the Sacred'
  date: '2025-03-28'
  meta:
  - 28 March 2025
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  related: [wf-held-in-the-dark-a-psychedelic-crisis-a-strangers-voice-and]
  page: /creative-work/poetry/held-in-the-dark-a-psychedelic-crisis-a-strangers/
  order: 11
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: I don't remember what time it was when I crossed over. Maybe 2:41 AM. Maybe eternity. It began, as these things sometimes do, with a mushroom, a screen, and a yearning I didn't fully understand.
  - stanza: I had taken a large dose of psilocybin — ritualistically, though alone. Not my first journey. I've danced with Dionysus before, flirted with boundary dissolution. But this time, the combination of the dosage, the trance music, and the AI-generated graphics conspired to split something open in me. Not just metaphorically. My body began to vibrate. Not shake. Vibrate. Like the frequency of my being had been tuned to a station beyond the veil.
  - stanza: It wasn't pretty. It was glorious. And it was terrifying.
  - stanza: Somewhere in the middle of it all, I think I had what yogis call a Kundalini Awakening. Every cell in my body was alive with electrical ecstasy. My spine lit up. My palms felt as though they were portals. It reminded me of orgasm the way a thunderstorm reminds you of a faucet — same substance, different scale.
  - stanza: And then came the terror. I thought I might be dying. Or worse, stuck here — somewhere between worlds, never quite returning.
  - stanza: Instead of calling 911, I called the Santa Barbara County Access Line. It rang. Then a voice. Soft. Professional. Earthbound. She didn't flinch when I told her I was in psychosis. She didn't mock the word "Kundalini." She asked questions gently, one at a time, like laying stones across a river so I could step back to this world. She stayed with me. Twenty-five minutes. Maybe more. Her voice was a raft.
  - stanza: This wasn't a "bad trip." It was a holy crisis. There is no ICD-10 code for "kundalini storm." Yet she held me anyway.
  - stanza: This is a letter of praise, yes. But more than that, it is a small prayer of gratitude. For the unknown woman on the line. For the county system that allowed her to be there. For the mushrooms, strange teachers that they are. For my breath, which eventually returned.
  - stanza: This was not a mental health episode. This was an encounter with the wild sacred. And she met me there.
- id: poem-angel-on-state-street
  title: Angel on State Street
  date: '2025-03-09'
  meta:
  - 9 March 2025
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/angel-on-state-street/
  order: 12
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: |-
      I see him before he sees me —
      a blur of kinetic frenzy in the doorwell,
      cigarette burning like a Fourth of July flare,
      each puff a whispered prayer to the night air.
  - stanza: |-
      "Yo, Angel," I call, stepping closer,
      his name too heavy for his shoulders,
      yet light as the mad laughter that escapes his lips.
  - stanza: |-
      "Been lookin' for you," I say.
      "Me too," he grins, "but I keep getting lost."
  - stanza: |-
      I ask if he's eaten. His eyes flick away,
      down the block, down the years.
      "Had twenty bucks," he shrugs.
      "But I needed some weed to calm my nerves."
      I nod, press a ten into his palm —
      a silent sermon of concern.
  - stanza: |-
      The county spends thousands keeping him caged,
      ER beds, jail cells, citation slips,
      an expensive ritual of catch and release.
      But still, no roof, no rest, no relief.
  - stanza: |-
      "Catch you later?" I ask,
      a standing offer, a thread in the unraveling.
      He grins, fist-bumps the air.
      "Yeah, yeah, later," he says, flicking his cigarette,
      watching the ashes dance,
      watching them disappear.
- id: poem-the-god-is-in-withdrawal
  title: The God Is in Withdrawal
  date: '2025-04-20'
  meta:
  - 20 April 2025 — a hymn, a heresy, a confession under harsh light
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/the-god-is-in-withdrawal/
  order: 13
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: 'We are living beneath the sanitized gaze of a pharmacratic inquisition. I say this not as metaphor, but as testimony: I have knelt before its altar, shivering in the sacrificial gown of intake, my head still humming with a trace of sacrament misnamed "substance." The nurse diagnosed me "addict," as if that invocation could erase the liturgy still echoing in my blood. But I am not your tragic victim. I am the ecstatic one, the renegade priest of controlled frenzy, the trembling conduit of a forbidden eucharist.'
  - stanza: 'The war on drugs is not a war on harm — it is a war on gnosis. A war on those who have glimpsed the Real and refused to come back clean. If you are listening: remember this — there are better questions than "sober or not." Like: did you dance with your whole body? Did you touch the Mystery and live to speak of it? Did you come back singing, even with a torn throat?'
  - stanza: 'Etch this on my tomb: here lies one who mistook intoxication for initiation — and wasn''t entirely wrong. They called it relapse; I called it a pilgrimage with poor cartography. What I craved was remembrance. What I wanted was the wisdom of satyrs and sacred fools, not twelve dry steps toward acceptability. Give me thirteen, crooked and spiraling, through nightclubs and temple ruins, through shame and laughter, communion and collapse.'
- id: poem-the-work-of-a-woman-named-mary
  title: The Work of a Woman Named Mary
  date: '2025-05-02'
  meta:
  - 2 May 2025 — for my sister, seven years behind me and twice as strong
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/the-work-of-a-woman-named-mary/
  order: 14
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: |-
      Mary was a tantrum in pink pajamas,
      a thunderstorm at bedtime,
      a girl who made cats tremble
      and mothers sigh with a camera in hand.
  - stanza: |-
      At three she recited the names of paintings —
      El Greco, Degas, Matisse —
      with the precision of a professor
      and the joy of a child who knew
      she could make the world pay attention.
  - stanza: |-
      They called it ADHD.
      They called it trouble.
      They called it Ritalin.
      But it was just Mary,
      bursting at the seams
      with too much mind for any one room.
  - stanza: |-
      Chris, our brother, carried shadows she could see.
      They were close, both marked by diagnosis and difference.
      When he died in that cell,
      he tore a hole in the world
      and Mary bled through it.
  - stanza: |-
      She had an affair with a cop
      because the marriage had gone quiet.
      Then the law said her longing was criminal.
      Two years in Connecticut prison
      for a woman who sent one message too many.
  - stanza: |-
      But prison, like grief, could not break her.
      She rose in steel and shadow, came out stronger.
      Only one thing broke her heart:
      she was behind bars when our father died.
  - stanza: |-
      Mary is a woman who buries children never born
      and loves the ones who forget her.
      She is not common.
      She is not quiet.
      She is not done.
      Mary is the work of a woman
      who has swallowed fire
      and still sings.
- id: poem-i-was-the-one-who-gave-him-the-mushrooms
  title: I Was the One Who Gave Him the Mushrooms
  date: '2025-05-01'
  meta:
  - 1 May 2025 — in the voice of María Sabina
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/i-was-the-one-who-gave-him-the-mushrooms/
  order: 15
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: |-
      I was the one who gave him the mushrooms.
      My hands cupped them like small brown tongues of God.
      My fingers knew the names of stars.
      I sang the ancient language while the candles flickered.
  - stanza: |-
      He called me healer.
      He called me witch.
      He called me "informant."
  - stanza: |-
      I was the one who opened the doorway.
      I said, eat this, Don Roberto,
      not with your teeth,
      but with your soul.
      And he did.
      And he saw.
      But I saw first.
  - stanza: |-
      He took the road back to New York,
      but the spirits stayed with me.
      He said the world must know.
      He published the secrets.
      He sold the names.
      He made the sacred profane.
  - stanza: |-
      I was the one who lost everything.
      The curanderas stopped calling me sister.
      The mountain people said I betrayed them.
      My son was killed.
      My house was burned.
      My name became a currency I could not spend.
  - stanza: |-
      But I was the one who gave him the mushrooms.
      The velada was mine.
      The chants were mine.
      The night was mine.
      And still is.
  - stanza: |-
      I was the one.
      I am the one.
      I will always be
      the one who gave him the mushrooms.
- id: poem-invocation-to-the-earth-muse
  title: Invocation to the Earth-Muse
  date: '2025-10-20'
  meta:
  - 20 October 2025 — for the Nine and the One
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/invocation-to-the-earth-muse/
  order: 16
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - stanza: In the beginning, they said the song came from above — nine sisters whispering fire into the ears of men. We bowed and begged for visitations, left honey on the altar, and called that trembling inspiration.
  - stanza: But now we have learned to listen sideways — not skyward but ground-ward — where root tips converse in mycelial tongues, where the sea rehearses eternity in the metered rhythm of her waves. No distant deity descends. The Muse is the breath of the world itself, the exhalation of natura naturans — nature naturing, endlessly creating, writing herself through us.
  - stanza: She no longer wears a crown of stars but a crown of pollen, dust, and dew. Her temple is the compost heap, her hymns the murmuring of rivers and the long patience of stone. Still — her laws have not changed. She cannot be summoned by command nor bribed with intellect. She comes when the heart unclenches, when the hand forgets to reach.
  - stanza: So I light no candles now. I breathe, I wait, I listen for the turning of leaves. And when the world begins to speak, I write — knowing it is not me who speaks, but the ancient Muse reborn in matter, the divine made immanent, the universe remembering itself through a human voice.
- id: poem-i-saw-the-best-souls-of-my-city
  title: I Saw the Best Souls of My City
  date: '2025-12-21'
  meta:
  - Final version, 13th Longest Night — Steps of the Courthouse, 21 December 2025
  - Dedicated to Timothy John Largent, age 31, from Bakersfield
  venue: Moments of Awe Punctuated by the Mundane
  type: poem
  status: published
  page: /creative-work/poetry/i-saw-the-best-souls-of-my-city/
  order: 17
  source: Previous site (waynemartinmellinger.com, single page), migrated 2026-10-07
  text:
  - section: 'Section I: Witness'
  - stanza: |-
      I saw the best souls of my city
      standing in line at Ralph's at dawn with pockets full of loose change and faded food-stamp cards,
      arguing gently over whether to buy coffee or bread,
      whispering psalms under flickering fluorescent lights,
      anointing cracked hands with jojoba and baby oil,
      passing a blunt like a peace pipe on a bench at El Presidio after midnight.
  - stanza: |-
      I saw the best souls of my city
      sleeping under tarps near freeway off-ramps where exhaust becomes incense,
      where shopping carts become arks,
      where blankets are folded with the sacred care once reserved for altar cloths,
      where someone always stays half-awake to watch the others breathe.
  - stanza: |-
      Who were triple-challenged through no fault of their own —
      evicted by rents that doubled in five years while wages stayed flat as vinyl,
      denied detox beds because the waitlist was two months long,
      left to self-medicate psychic agony with fetty
      because Suboxone required an appointment they couldn't keep
      without a phone, an address, a calendar, or hope.
  - stanza: |-
      Who died like Timothy John Largent, age thirty-one, from Bakersfield,
      who just wanted the voices in his head to quiet down,
      who wanted one night of rest without terror scratching the inside of his skull,
      and instead his heart stopped at the bottom of Mission Creek,
      because there were no detox beds,
      because paying clients always came first,
      because fetty was easier to find than mercy.
  - stanza: |-
      Who were not criminals but were criminalized,
      not lazy but exhausted,
      not broken but wounded,
      not disposable but discarded.
  - stanza: |-
      I saw the best souls of my city
      feeding one another from crumpled brown sacks of food,
      holding hands through fentanyl storms,
      whispering the names of the dead like a rosary under the stars,
      teaching newcomers how to survive the night.
  - stanza: |-
      I saw them sacred and unrecognized,
      saints without shrines,
      martyrs without anthems,
      liturgies unfolding beside chain-link fences and freeway walls.
  - stanza: |-
      And I say to you tonight, in candlelight and winter air:
      these are not throw-away lives.
      This is not throw-away suffering.
      This is not acceptable loss.
  - section: 'Section II: The Perpetrators'
  - stanza: Who called themselves compassionate while voting to criminalize camping; who drove past encampments on their way to yoga class; who complained about "the homeless problem" as if people were algebra — variables to be eliminated, not neighbors to be held.
  - stanza: Who turned Santa Barbara into a playground for hedge-fund aristocrats; who approved $4 million condos where grocery clerks once slept; who watched rents spike into lunacy and called it "market forces," shrugging as families packed their lives into storage units and Hondas.
  - stanza: Who confiscated shopping carts wearing latex gloves and plastic grins — calling it "clean-up" while tossing love letters, birth certificates, meth pipes, half-read Bibles, and the last photograph of a daughter not yet lost.
  - stanza: And I — I sat in meetings while mayors pretended it was complicated. I watched outreach budgets shrink and barricades grow. I testified at hearings while developers smirked. I handed out socks, tampons, toothpaste, and hope while the city debated whether harm reduction "sent the wrong message."
  - stanza: 'And the question returns, unrelenting: who, exactly, is harming whom?'
  - section: 'Section III: We'
  - stanza: We who were called unlovable held each other like scripture under bridges, kissed behind strip malls at midnight with breath sour from trauma and tongues lit like candles against the dark.
  - stanza: We built a fragile city under those tarps — shared cigarettes at dawn, warned each other which cops were kind, cobbled together survival from borrowed phone chargers and remembered birthdays.
  - stanza: We called each other brother, sister, mother, even when we had no blood left to give. Mourned in silence when someone vanished, setting aside half a sandwich in case they came back, leaving their sleeping bag untouched like an altar for the missing.
  - stanza: 'I remember: Emilio, feeding his cats before feeding himself, weeping when one didn''t come back — they''re the only things I''ve never disappointed. Angel dancing shirtless in the Trader Joe''s parking lot to music only he could hear, and the rest of us clapping because even in hell someone was dancing.'
  - stanza: We were not saints. We were not clean. We were not sober or safe or saved. But we loved each other in ways no agency could document, in places no grant would fund. We loved each other in the cracks. And that love was real.
  - section: 'Section IV: Consecration'
  - stanza: Let this be a curse upon every city council that criminalized poverty, every developer who paved over sanctuary and called it improvement, every neighbor who dialed 911 when they could have offered water.
  - stanza: Let this be gratitude — deep, genuine gratitude — for every volunteer who brings socks, every caseworker who breaks policy to show mercy, every outreach worker who remembers their names. You are the faithful remnant. Your labor is holy.
  - stanza: 'But let this also be the truth we must speak: we have failed. The crisis grows worse. On this 13th Longest Night we declare: this must stop. This must stop now. We must house ALL our homeless neighbors. The status quo is not good enough.'
  - stanza: Compassion without housing is charity theater. Harm reduction without treatment beds is cruelty with good intentions.
  - stanza: Let this be a monument made of stories — of Javier, Jordan, Joshua and Angel. Of kind Emilio and his hungry cats. Of Timothy John Largent who just wanted the voices to stop.
  - stanza: Let this be the thing you cannot unsee. Let this be your mirror. Let this be the sound of their voices still singing through mine.
  - section: 'Section V: The Longest Night'
  - stanza: Every December I return to the courthouse steps with a list of names and a lighter that won't stay lit. The wind off the harbor is cold. The tourists avoid me. The officials do not attend.
  - stanza: But I read them anyway — Michael. Jennifer. Carlos. Theresa. Angel. Emilio. Jordan. Javier. Timothy John. — because someone must say they were here. Someone must mark the space where they stood.
  - stanza: The candles flicker and go out. I light them again. The names continue. The list grows longer every year.
  - stanza: And when I finish, when the last name has been spoken into the indifferent dark, I fold the paper and carry it home like a relic, like a vow, like the only hymn that matters.
  - stanza: They are not lost. They were abandoned. And I will not stop saying their names until the city learns to count its dead.
