- slug: doing-modernity
  name: Doing Modernity
  title: "Doing Modernity: Studies in Critical Interactionism"
  venue: Doing Modernity
  section: { label: Scholarship, url: /scholarship/ }
  path: /scholarship/doing-modernity/
  file: doing-modernity
  home: https://doingmodernity.blogspot.com/
  group_by: series
  series:
    - name: I. Overviews & Theoretical Frameworks
      parent: "The Santa Barbara School: An Annotated Bibliography"
      parent_intro: Compiled February 2026, ongoing. UCSB has been a major center for ethnomethodology and conversation analysis since the mid-1960s, yet the Santa Barbara School has never been systematically documented as a tradition — this bibliography, and the theoretical framework of Critical Interactionism it develops, is an attempt to remedy that.
    - { name: II. Founders & First-Generation Figures, parent: "The Santa Barbara School: An Annotated Bibliography" }
    - { name: III. Institutional Sites & Applied Work, parent: "The Santa Barbara School: An Annotated Bibliography" }
    - { name: IV. The Second Santa Barbara School, parent: "The Santa Barbara School: An Annotated Bibliography" }
    - { name: V. Critical Interactionism & Normative Questions, parent: "The Santa Barbara School: An Annotated Bibliography" }
    - { name: Sociology of Homelessness & Abandonment, parent: Other essays }
    - { name: Workplace Studies & Applied EM/CA, parent: Other essays }
    - { name: Human-AI Interaction, parent: Other essays }
    - { name: "Media, Politics & Other Essays", parent: Other essays }
    - { name: Also on Doing Modernity, parent: Other essays, intro: Additional essays not part of the Santa Barbara School bibliography above. }
  noun: essay
  intro: Wayne’s research platform for Critical Interactionism, institutions and recognition, and the Santa Barbara School of ethnomethodology. Each title links to the essay on Doing Modernity.
  coverage: A selection — the essays Wayne listed on the previous site. The full Doing Modernity archive has not yet been catalogued here; read everything at the platform itself.
  schema: Article

- slug: dionysian-naturalist
  name: The Dionysian Naturalist
  title: "The Dionysian Naturalist: Studies in Religious Naturalism and Other Emerging Nature Religions"
  venue: The Dionysian Naturalist
  section: { label: Religion & Philosophy, url: /religion-philosophy/ }
  path: /religion-philosophy/dionysian-naturalist/
  file: dionysian-naturalist
  home: https://thedionysiannaturalist.blogspot.com/
  group_by: series
  series:
    - name: Annotated Bibliography (2014–2025)
      intro: Compiled by Wayne, February 2026. The essays trace an evolving eco-theological architecture — from early writings on shamanism, recovery, and ecstatic experience, through cosmology and enchanted naturalism, to ritual theory, sacred nature, and political eco-theology.
    - name: Also on The Dionysian Naturalist
      intro: Full-length, finished essays not included in the annotated bibliography above.
  noun: work
  intro: Wayne’s platform for religious naturalism, contemporary Paganism and ecstatic spiritual practice — the theological framework he calls Dionysian Naturalism. Each title links to the essay on The Dionysian Naturalist.
  coverage: A selection — the works Wayne listed on the previous site. The full archive of The Dionysian Naturalist has not yet been catalogued here.
  schema: Article

