# Collections: where a work was published. One records file per collection, in _data/works/.
#
#   slug      short name used in records and filters
#   name      short display name           title   page heading
#   section   the part of the site the collection page sits under (breadcrumb)
#   path      the collection's page        file    its records file in _data/works/
#   home      the original venue, if any
#   group_by  year (default) | series (Wayne's own headings, in the order given) | none (file order)
#   noun      what one record is called in counts ("column", "essay")
#   intro     one or two sentences shown under the heading
#   coverage  an honest note on how complete the listing is
#   schema    schema.org type for the works in the page's structured data
#
# The Noozhawk entry's slug, path and file are unchanged from the accepted pilot.

